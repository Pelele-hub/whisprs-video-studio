name: Whisprs 8AM & 8PM Buffer Scheduler

on:
  schedule:
    # Run right after 08:00 & 20:00 Casablanca publish times (+ backup windows in case of GitHub cron delays)
    - cron: '23 1,9,13,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write # Needed to commit updated queue status

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Schedule Upcoming Posts in Buffer (8AM & 8PM Casablanca)
        env:
          BUFFER_WHISPRS_TOKEN: ${{ secrets.BUFFER_WHISPRS_TOKEN || secrets.BUFFER_TOKEN }}
        run: |
          node scripts/cloud_whisprs_publisher.mjs

      - name: Commit & Push Updated Queue
        run: |
          git config --global user.name "Whisprs Studio Bot"
          git config --global user.email "bot@whisprs.local"
          git add jobs/whisprs_cloud_publish_queue.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-scheduled Whisprs reel in Buffer [skip ci]" && git push)
